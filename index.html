
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Safety Demo</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f6fb,#080b12);--panel:light-dark(#fff,#111722);--text:light-dark(#172033,#edf2fa);--muted:light-dark(#667085,#9aa7ba);--line:light-dark(#dfe5ee,#283243);--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#app{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(100%,430px);padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px #00000014}
.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:light-dark(#eaf0ff,#17274a);color:var(--blue);font-size:22px;font-weight:800;margin-bottom:24px}
h1{font-size:28px;letter-spacing:-.5px;margin:0 0 12px}
.sub{color:var(--muted);line-height:1.55;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:650;margin:16px 0 7px}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:17px}
.alert{width:min(100%,700px);text-align:center}
.alert h1{color:#ff343f;font-size:clamp(34px,7vw,64px)}
.alert p{color:var(--muted);line-height:1.6}
.status{display:inline-block;margin-top:20px;border:1px solid #71323a;color:#ff737b;padding:10px 14px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<main id="app">
<section class="card">
<div class="mark">W</div>
<h1>Welcome!</h1>
<p class="sub">Tai kibernetinio saugumo demonstracija.</p>
<form id="details-form" autocomplete="off">
<label for="first">First name</label>
<input id="first" name="first" placeholder="Enter your first name" maxlength="60" required>
<label for="last">Last name</label>
<input id="last" name="last" placeholder="Enter your last name" maxlength="60" required>
<button type="submit">Continue</button>
</form>
<p class="fine">Tik mokomoji demonstracija. Nevesk slaptažodžių ar jautrios informacijos.</p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://wupmkjuttnjsxzkejviz.supabase.co';
const SUPABASE_KEY='sb_publishable_fJwyIIamC8-w_kM-LEPzKg_cAxPiy2X';

const app=document.getElementById('app');
const form=document.getElementById('details-form');
const defaults={
  enabled:true,
  wait_seconds:30,
  eyebrow:'CYBER SECURITY ALERT',
  headline:"YOU'VE BEEN HACKED!",
  detail:'UNAUTHORIZED ACCESS DETECTED'
};

let settings={...defaults};
let client;
let busy=false;

function escapeHTML(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}

async function start(){
  if(!window.supabase){
    throw new Error('Supabase biblioteka neįkelta.');
  }

  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const {data,error}=await client
    .from('demo_settings')
    .select('enabled,wait_seconds,eyebrow,headline,detail')
    .eq('id',1)
    .maybeSingle();

  if(error) throw error;

  if(data) settings={...defaults,...data};

  if(!settings.enabled){
    showDisabled();
    return;
  }

  form.addEventListener('submit',submitVisitor);
}

function showDisabled(){
  app.innerHTML=`
    <section class="card">
      <div class="mark">i</div>
      <h1>Demonstracija išjungta</h1>
      <p class="sub">Šiuo metu demonstracija nepasiekiama.</p>
    </section>`;
}

async function submitVisitor(event){
  event.preventDefault();
  if(busy) return;

  if(!settings.enabled){
    showDisabled();
    return;
  }

  const first=document.getElementById('first').value.trim();
  const last=document.getElementById('last').value.trim();
  const fullName=(first+' '+last).trim();

  if(!first||!last||fullName.length>120){
    alert('Patikrink įvestus duomenis.');
    return;
  }

  busy=true;
  const button=form.querySelector('button');
  button.disabled=true;
  button.textContent='Siunčiama…';

  try{
    const {error}=await client
      .from('visitor_entries')
      .insert({visitor_name:fullName});

    if(error) throw error;

    app.innerHTML=`
      <section class="card" style="text-align:center">
        <div class="mark" style="margin:0 auto 24px">✓</div>
        <h1>Ačiū!</h1>
        <p class="sub">Tai mokomoji demonstracija. Tuoj pasirodys įspėjimas.</p>
        <p class="fine">Įrašas išsaugotas.</p>
      </section>`;

    const delay=Math.max(
      1,Math.min(300,Number(settings.wait_seconds)||30)
    )*1000;

    window.setTimeout(showAlert,delay);
  }catch(error){
    console.error(error);
    busy=false;
    button.disabled=false;
    button.textContent='Continue';
    alert('Nepavyko išsaugoti įrašo. Patikrink Supabase lentelę ir RLS taisykles.');
  }
}

function showAlert(){
  app.innerHTML=`
    <section class="alert">
      <p>${escapeHTML(settings.eyebrow)}</p>
      <div style="font-size:58px;color:#ff343f">▣</div>
      <h1>${escapeHTML(settings.headline)}</h1>
      <p>${escapeHTML(settings.detail)}</p>
      <div class="status">SIMULATED SECURITY ALERT</div>
      <p>Tai tik demonstracija – tavo įrenginys nebuvo nulaužtas.</p>
      <button id="again" style="max-width:220px">Bandyti dar kartą</button>
    </section>`;

  document.getElementById('again').onclick=()=>location.reload();
}

start().catch(error=>{
  console.error(error);
  app.innerHTML=`
    <section class="card">
      <h1>Ryšio klaida</h1>
      <p class="sub">Nepavyko įkelti demonstracijos nustatymų. Patikrink interneto ryšį, Supabase lenteles ir RLS taisykles.</p>
      <button onclick="location.reload()">Bandyti dar kartą</button>
    </section>`;
});
</script>
</body>
</html>
