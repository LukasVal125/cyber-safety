
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Safety Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}
.card{width:min(100%,440px);padding:30px;background:#151d31;border:1px solid #2b3854;border-radius:18px}
.logo{width:44px;height:44px;display:grid;place-items:center;background:#263b68;color:#93b5ff;border-radius:12px;font-weight:bold;font-size:22px}
h1{font-size:28px;margin:22px 0 10px}
p{color:#b5c1d8;line-height:1.55}
label{display:block;margin:18px 0 7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid #394760;border-radius:9px;background:#0c1324;color:white;font:inherit}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:#3478f6;color:white;font-weight:bold;font-size:15px;cursor:pointer}
.small{text-align:center;font-size:12px;margin-top:18px}
.alert{text-align:center;width:min(100%,750px)}
.alert h1{color:#ff4658;font-size:clamp(36px,8vw,64px)}
.alert-icon{font-size:56px;color:#ff4658}
.status{display:inline-block;border:1px solid #a63748;padding:10px 14px;border-radius:8px;color:#ff8995;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main id="app">
<section class="card">
<div class="logo">W</div>
<h1>Welcome!</h1>
<p>Enter your details to continue.</p>
<form id="visitor-form">
<label for="first">First name</label>
<input id="first" maxlength="60" required autocomplete="given-name">
<label for="last">Last name</label>
<input id="last" maxlength="60" required autocomplete="family-name">
<button type="submit">Continue</button>
</form>
<p class="small">Cybersecurity demonstration. Your name is saved in this browser for demonstration purposes. Do not enter sensitive information.</p>
</section>
</main>
<script>
const app = document.getElementById('app');
const defaults = {
  enabled:true,
  waitSeconds:30,
  eyebrow:'CYBER SECURITY ALERT',
  headline:"YOU'VE BEEN HACKED!",
  detail:'UNAUTHORIZED ACCESS DETECTED'
};
function read(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch { return fallback; }
}
function getSettings() {
  return {...defaults, ...read('cyberDemoSettings', {})};
}
document.getElementById('visitor-form').addEventListener('submit', event => {
  event.preventDefault();
  const settings = getSettings();
  if (!settings.enabled) {
    alert('Demonstration is currently disabled by the administrator.');
    return;
  }
  const first = document.getElementById('first').value.trim();
  const last = document.getElementById('last').value.trim();
  if (!first || !last) return;

  const visitors = read('cyberDemoVisitors', []);
  visitors.push({
    name:first + ' ' + last,
    time:new Date().toLocaleString()
  });
  localStorage.setItem('cyberDemoVisitors', JSON.stringify(visitors));

  app.innerHTML = '<section class="card" style="text-align:center"><div class="logo" style="margin:auto">✓</div><h1>Thank you!</h1><p>Please wait while the demonstration continues...</p></section>';

  window.setTimeout(() => {
    const s = getSettings();
    app.innerHTML = '<section class="alert"><p style="letter-spacing:3px;color:#ff8995;font-weight:bold" id="eyebrow"></p><div class="alert-icon">⚠</div><h1 id="headline"></h1><p id="detail"></p><div class="status">SIMULATED SECURITY ALERT — DEMO ONLY</div></section>';
    document.getElementById('eyebrow').textContent = s.eyebrow;
    document.getElementById('headline').textContent = s.headline;
    document.getElementById('detail').textContent = s.detail;
  }, Math.max(1, Math.min(300, Number(settings.waitSeconds) || 30)) * 1000);
});
</script>
</body>
</html>
