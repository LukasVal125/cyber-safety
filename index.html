
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 20px;
      font-family: Arial, sans-serif;
      background: #080d18; color: #f1f5f9;
    }
    .card {
      width: min(100%, 430px); padding: 32px;
      border: 1px solid #263449; border-radius: 20px;
      background: #111a29;
    }
    .mark {
      display: grid; place-items: center;
      width: 46px; height: 46px; border-radius: 14px;
      background: #1d3155; color: #60a5fa;
      font-size: 23px; font-weight: bold; margin-bottom: 24px;
    }
    h1 { font-size: 30px; margin: 0 0 12px; }
    p { color: #a9b7ca; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; }
    input {
      width: 100%; padding: 13px; border-radius: 9px;
      border: 1px solid #34445b; background: #0b1220;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; padding: 14px; margin-top: 22px;
      border: 0; border-radius: 9px; background: #2563eb;
      color: white; font-size: 16px; font-weight: bold;
      cursor: pointer;
    }
    .fine { text-align: center; font-size: 12px; }
    .alert { text-align: center; }
    .red { color: #ff4655; }
    .status {
      display: inline-block; margin-top: 20px; padding: 10px;
      border: 1px solid #71323a; border-radius: 8px;
      color: #ff737b; font-size: 12px;
    }
    .again {
      max-width: 220px; background: transparent;
      border: 1px solid #34445b;
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="card">
      <div class="mark">W</div>
      <h1>Welcome!</h1>
      <p>Please enter your details to continue.</p>
      <form id="details-form" autocomplete="off">
        <label for="first">First name</label>
        <input id="first" maxlength="60" required>
        <label for="last">Last name</label>
        <input id="last" maxlength="60" required>
        <button type="submit">Continue</button>
      </form>
      <p class="fine">Cyber Safety Demonstration</p>
    </section>
  </main>

  <script>
    const app = document.getElementById('app');
    const defaults = {
      waitSeconds: 30,
      enabled: true,
      eyebrow: 'CYBER SECURITY ALERT',
      headline: "YOU'VE BEEN HACKED!",
      detail: 'UNAUTHORIZED ACCESS DETECTED'
    };

    function getSettings() {
      try {
        return {
          ...defaults,
          ...JSON.parse(localStorage.getItem('cyberDemoSettings') || '{}')
        };
      } catch {
        return { ...defaults };
      }
    }

    document.getElementById('details-form').addEventListener('submit', event => {
      event.preventDefault();
      const settings = getSettings();

      if (!settings.enabled) {
        alert('The demonstration is currently disabled.');
        return;
      }

      // Names are not saved or sent anywhere.
      document.getElementById('first').value = '';
      document.getElementById('last').value = '';

      app.innerHTML = `
        <section class="card" style="text-align:center">
          <div class="mark" style="margin:0 auto 24px">✓</div>
          <h1>Thank you!</h1>
          <p>Your page is ready. Please wait...</p>
        </section>`;

      setTimeout(() => {
        const latest = getSettings();

        app.innerHTML = `
          <section class="alert">
            <p class="red">${escapeHTML(latest.eyebrow)}</p>
            <div style="font-size:56px">⚠</div>
            <h1 class="red">${escapeHTML(latest.headline)}</h1>
            <p>${escapeHTML(latest.detail)}</p>
            <div class="status">SIMULATED SECURITY ALERT</div>
            <p>This is a cybersecurity awareness demonstration.</p>
            <button class="again" onclick="location.reload()">
              Restart demo
            </button>
          </section>`;
      }, Math.max(1, Math.min(300, Number(settings.waitSeconds) || 30)) * 1000);
    });

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }
  </script>
</body>
</html>
